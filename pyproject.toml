# This file is part of the Canadian Open Neuroscience Platform (CONP) Portal project.

[project]
name = "conp-portal"
version = "1.1.0"
description = "The Canadian Open Neuroscience Platform (CONP) Portal is a web interface that facilitates open science for the neuroscience community by simplifying global access to and sharing of datasets and tools. The Portal internalizes the typical data cycle of a research project, beginning with data acquisition, followed by data processing with published tools, and ultimately the publication of results with a link to the original dataset."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "CONP-PCNO" }]
dependencies = [
    "alembic==1.14.1",
    "boutiques==0.5.28",
    "click==8.1.6",
    "datalad==1.2.0",
    "flask==3.0.3",
    # "flask-bootstrap==3.3.7.1", ## Not sure if needed
    "flask-bootstrap4==4.0.2",
    "flask-dance==3.0.0",
    "flask-login==0.6.3",
    "flask-mail==0.9.1",
    "flask-migrate==2.4.0",
    "flask-sqlalchemy==3.1.1",
    "flask-user==1.0.2.2",
    "bcrypt<4", ## required by Flask-User
    "flask-wtf==1.2.1",
    "gitpython==3.1.41",
    "markupsafe==2.1.5",
    "pygithub==1.44.1",
    "python-dateutil==2.8.0",
    "python-dotenv==1.1.1",
    "pytz==2018.9",
    "requests==2.34.2",
    "sqlalchemy==2.0.38",
    "sqlalchemy-utils==0.41.2",
    "unidecode==1.3.8",
    "werkzeug==3.0.6",
    "whoosh==2.7.4",
    "wtforms==2.2.1",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "prek>=0.5.2",
    "pytest==8.3.5",
    "ruff>=0.16.8",
]
