# This file is part of the Canadian Open Neuroscience Platform (CONP) Portal project.

[project]
name = "conp-portal"
version = "1.1.1rc4"
description = "The Canadian Open Neuroscience Platform (CONP) Portal is a web interface that facilitates open science for the neuroscience community by simplifying global access to and sharing of datasets and tools. The Portal internalizes the typical data cycle of a research project, beginning with data acquisition, followed by data processing with published tools, and ultimately the publication of results with a link to the original dataset."
readme = "README.md"
requires-python = ">=3.12.3"
authors = [{ name = "CONP-PCNO" }]
license = "MIT License"
dependencies = [
    "alembic==1.*",
    "boutiques>=0.5.33",
    "click==8.5.0",
    "datalad~=1.7",
    "flask==3.1.3",
    "flask-dance==7.*",
    "flask-login==0.6.3",
    "Flask-Mail==0.10.*",
    "flask-migrate==2.*",
    "flask-sqlalchemy==3.*",
    "flask-user==1.0.2.2",
    "Flask-WTF==1.3.*",
    "gitpython==3.2.*",
    "markupsafe==3.*",
    "pygithub==1.*",
    "python-dotenv==1.*",
    "requests==2.34.2",
    "sqlalchemy==2.*",
    "sqlalchemy-utils==0.43.*",
    "unidecode==1.*",
    "whoosh==2.*",
    "wtforms==2.*",
    "gunicorn>=26.2.0",
    "pymysql==1.2.*",
    "gitdb>=4.0.12",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "deptry==0.25.*",
    "flake8==7.*",
    "pipdeptree==4.*",
    "prek==0.5.*",
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "ruff==0.17.*",
    "semver==3.*",
]

[project.urls]
Homepage = "https://portal.conp.ca/"
Repository = "https://github.com/CONP-PCNO/conp-portal/"
Issues = "https://github.com/CONP-PCNO/conp-portal/issues"
Changelog = "https://github.com/CONP-PCNO/conp-portal/blob/main/CHANGELOG.md"

[tool.ruff]
# excluded directories
extend-exclude = [
    "test/",
    "tests/",
    "docs/"
]
[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), mccabe complexity (C90),
# and popular Flake8 plugins natively supported by Ruff:
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "C90", # mccabe (complexity)
    "I",   # isort (if you used flake8-isort)
    "N",   # pep8-naming (if you used flake8-naming)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modernizing code)
    "RUF", # Ruff-specific rules
]

# Ignore specific rules if they conflict with your formatter (like Ruff format or Black)
ignore = [
    "E501", # Line length violations (let the formatter handle this)
]

[tool.pytest.ini_options]
# Tells pytest to completely skip these directories during collection
addopts = "--ignore=.venv --ignore=venv --ignore=node_modules --ignore=data --ignore=__pycache__ --ignore=docs --ignore=index --ignore=test --ignore=kb --ignore=logs"
testpaths = ["tests"]
