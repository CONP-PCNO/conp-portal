{% extends 'common/base_main.html' %}

{% block head %} {{ super() }}
<title>CONP Portal | Experiments Search</title>
{% endblock %}

{% block contenttitle %}
<h2>Experiments Search</h2>
{% endblock %}

{% block appcontent %}
<div id="experiments-search"></div>
<script>
  // The bundle is loaded with defer, so wait until it has run.
  document.addEventListener('DOMContentLoaded', function () {
    const { ExperimentsSearchPage, React, ReactDOM } = CONP;
    const keywordData = "{{ keyword }}";
    const element = React.createElement(ExperimentsSearchPage, {
      experiments: {{ experiments|tojson }},
      keyword: keywordData
    })
    ReactDOM.render(element, document.getElementById('experiments-search'));
  });
</script>
{% endblock %}
